name: baseline_h7
data:
  directory: data/1d
  min_history_days: 180
  feature_universe_max: 150
cache:
  directory: .cache
models:
  - name: lgb_lambdarank_h7
    horizon: 7
    weight: 1.0
training:
  prediction_start: 2023-08-01
  train_window_days: 730
  retrain_every_days: 56
  train_stride: 3
  seed: 42
  n_jobs: 4
  n_estimators: 160
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 100
  subsample: 0.85
  colsample_bytree: 0.80
  reg_alpha: 0.5
  reg_lambda: 6.0
  max_bin: 127
portfolio:
  universe_size: 100
  tail_fraction: 0.10
  weighting: invvol
  smoothing_days: 7
  dollar_neutral: true
  btc_beta_neutral: true
  overlay:
    enabled: false
costs:
  one_way_bps: 10.0
evaluation:
  oos_start: 2023-08-05
  oos_end: 2026-08-04
  latest_year_start: 2025-08-05
  periods_per_year: 365
reference:
  file: reference/expected_baseline_h7.json
