[model]
bundle = "models/lightgbm_h7_champion_20261013"

[data]
directory = "../train/data/1d"

[strategy]
# Research champion v2_base_neutral: blend the BTC-neutral book 50/50 with a book that is also
# neutral to the equal-weighted alt index and to size (20-day dollar-volume z-score).
alt_beta_neutral = 0.5
size_neutral = true

[paper]
initial_equity_usd = 1000.0
gross_leverage = 1.0
max_gross_leverage = 1.25
fee_bps = 10.0
reject_partial_fills = true

[server]
bind = "127.0.0.1:18789"

[storage]
ledger_path = "state/paper/airok-paper.sqlite3"

[bybit]
orderbook_depth = 50
rest_parallelism = 12
ws_batch_size = 10
close_grace_seconds = 90
minimum_confirmed_coverage = 0.80
copy_trading_only = false
