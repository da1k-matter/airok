name: catboost_h7_multiseed
backend:
  name: catboost
  params:
    loss_function: "YetiRankPairwise:mode=NDCG;top=8;type=Base"
    iterations: 160
    depth: 6
    learning_rate: 0.05
    l2_leaf_reg: 8.0
    random_strength: 0.5
    bootstrap_type: Bernoulli
    subsample: 0.85
    rsm: 0.80
    border_count: 127
    thread_count: 4
    allow_writing_files: false
    verbose: false

data:
  directory: data/1d
  min_history_days: 180
  feature_universe_max: 150
cache:
  directory: .cache
models:
  - horizon: 7
    weight: 1.0
training:
  prediction_start: 2023-08-01
  train_window_days: 730
  retrain_every_days: 56
  train_stride: 3
  minimum_train_rows: 5000
  seeds: [11, 23, 37, 53, 71]
ensemble:
  method: mean_rank
  renormalize_portfolio_average: false
portfolio:
  universe_size: 75
  tail_count: 6
  weighting: invvol
  smoothing_days: 21
  dollar_neutral: true
  btc_beta_neutral: true
  overlay:
    enabled: true
    median_lookback: 180
    median_min_periods: 90
    median_lag: 1
    low_vol_multiplier: 1.10
    high_vol_multiplier: 0.75
costs:
  one_way_bps: 10.0
evaluation:
  oos_start: 2023-08-05
  oos_end: 2026-08-04
  latest_year_start: 2025-08-05
  periods_per_year: 365
  fee_stress_bps: [5, 10, 15, 20, 30]
