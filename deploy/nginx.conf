map $http_x_forwarded_proto $airok_forwarded_proto {
    default $scheme;
    https https;
    http http;
}

server {
    listen 8089;
    server_name _;
    access_log off;
    error_log /var/log/nginx/airok.error.log crit;

    location / {
        rewrite ^/__airok/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18089;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $airok_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
