[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airok-gbm"
version = "2.0.0"
description = "Compact cross-sectional crypto ranking pipeline with LightGBM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "numba>=0.59",
  "lightgbm>=4.3",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "aiohttp>=3.9",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
airok = "cli:main"
airok-export = "export_bundle:main"
airok-scrape = "scraper_bybit:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "config", "data", "export_bundle", "pipeline", "portfolio", "reporting", "research", "scraper_bybit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
